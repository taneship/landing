[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

# Brevo sends a visitor to one URL for all languages: these rules send them on to the page
# in the language of their browser. The URLs are not those of the pages, which Netlify matches
# with or without the trailing slash: a rule on the English page would send a visitor who
# switches to English back to their browser's language.
[[redirects]]
from = "/brevo/waitlist/pending"
to = "/fr/waitlist/pending/"
status = 302
conditions = { Language = ["fr"] }

[[redirects]]
from = "/brevo/waitlist/pending"
to = "/es/waitlist/pending/"
status = 302
conditions = { Language = ["es"] }

[[redirects]]
from = "/brevo/waitlist/pending"
to = "/waitlist/pending/"
status = 302

[[redirects]]
from = "/brevo/waitlist/confirmed"
to = "/fr/waitlist/confirmed/"
status = 302
conditions = { Language = ["fr"] }

[[redirects]]
from = "/brevo/waitlist/confirmed"
to = "/es/waitlist/confirmed/"
status = 302
conditions = { Language = ["es"] }

[[redirects]]
from = "/brevo/waitlist/confirmed"
to = "/waitlist/confirmed/"
status = 302

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
Referrer-Policy = "strict-origin-when-cross-origin"
Strict-Transport-Security = "max-age=31536000"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Permissions-Policy = "camera=(), geolocation=(), microphone=()"

# Astro names these files after their content: they never change.
[[headers]]
for = "/_astro/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
